name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: a new linter release must be an intentional upgrade,
          # not a build that starts failing on its own.
          version: v2.6.1

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - name: go test -race
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      # The docker build only sees tracked files, so a source file excluded
      # by .gitignore compiles locally and fails here. Catch it directly.
      - name: every Go package is tracked by git
        run: |
          untracked=$(git ls-files --others --exclude-standard -- '*.go')
          if [ -n "$untracked" ]; then
            echo "Go sources not tracked by git (check .gitignore):"
            echo "$untracked"
            exit 1
          fi
      - name: docker build
        run: docker build -t costlane:ci .
