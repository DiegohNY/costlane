name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: a new linter release must be an intentional upgrade,
          # not a build that starts failing on its own.
          version: v2.13.2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      # The store package is covered by the integration job, which has a
      # docker daemon; running it here too would only duplicate the work.
      - name: go test -race
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out \
            $(go list ./... | grep -vE '/internal/(store|api|budget|proxy|storetest|leaktest)')
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # testcontainers starts its own pinned Postgres; the runner's docker
      # daemon is all it needs.
      - name: go test -race (integration)
        run: go test ./internal/store/... ./internal/api/... ./internal/budget/... ./internal/proxy/... -race -timeout 20m -v

  leak:
    name: leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # Credentials escape through whole systems — a log line, an error
      # body, a metric label, a database column — so this is an integration
      # test that drives every failure path and then searches all of them.
      - name: no credential escapes any path
        run: go test ./internal/leaktest/... -race -timeout 10m -v

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # A short budget on every PR catches the obvious; the nightly run
      # goes deeper. Both targets parse input from a third party, which is
      # the case fuzzing exists for.
      - name: fuzz the SSE frame reader
        run: go test ./internal/proxy/ -run FuzzFrameReader -fuzz FuzzFrameReader -fuzztime 30s
      - name: fuzz the Anthropic stream translator
        run: |
          go test ./internal/provider/ -run FuzzAnthropicStreamTranslator \
            -fuzz FuzzAnthropicStreamTranslator -fuzztime 30s
      # Same budget as the other two. It earned it on its first run: a
      # negative token count from a provider went straight into the meter,
      # where Table.Cost refuses it with an error that callers swallow into a
      # zero cost — an absurd figure upstream becoming a free request.
      - name: fuzz the Gemini stream translator
        run: |
          go test ./internal/provider/ -run FuzzGoogleStreamTranslator \
            -fuzz FuzzGoogleStreamTranslator -fuzztime 30s

  vuln:
    name: vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # A gateway holds provider credentials and a customer's prompts. A
      # known vulnerability in a dependency is not a warning to triage
      # later, so this job blocks like every other one.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  bench:
    name: bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # Only the CPU-bound stream benchmarks are gated. The end-to-end
      # figures published in the README involve a container, a socket and a
      # shared runner, and their noise is larger than any regression worth
      # catching; gating on them would produce a flaky required check,
      # which teaches people to rerun rather than to look.
      - name: benchmark this branch
        run: go test ./internal/proxy/ -run '^$' -bench "$BENCHES" -count 6 | tee new.txt
        env:
          BENCHES: BenchmarkStreamPassthrough|BenchmarkStreamWithUsageStripping|BenchmarkFrameReader

      - name: benchmark the merge base
        run: |
          git worktree add ../base "$(git merge-base origin/$BASE_REF HEAD)"
          cd ../base
          go test ./internal/proxy/ -run '^$' -bench "$BENCHES" -count 6 | tee "$GITHUB_WORKSPACE/old.txt"
        env:
          BENCHES: BenchmarkStreamPassthrough|BenchmarkStreamWithUsageStripping|BenchmarkFrameReader
          BASE_REF: ${{ github.base_ref }}

      - name: compare
        run: |
          benchstat old.txt new.txt | tee comparison.txt
          {
            echo '### Benchmark comparison'
            echo '```'
            cat comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only a doubling blocks. A tighter gate on a shared runner is a coin
      # flip, and a coin flip that blocks merges gets disabled.
      - name: gate on a regression larger than 100%
        run: |
          worst=$(grep -oE '\+[0-9]+\.[0-9]+%' comparison.txt | tr -d '+%' | sort -g | tail -1)
          if [ -z "$worst" ]; then
            echo "no regression reported"
            exit 0
          fi
          echo "largest regression: ${worst}%"
          awk -v w="$worst" 'BEGIN { if (w > 100) { print "regressed by more than 100%"; exit 1 } }'

      # The figures the README publishes. They are measured here rather than
      # on someone's laptop so that the methodology is a file anyone can read
      # and the hardware is one anyone can rent. They gate nothing: see the
      # comment above on runner noise.
      - name: measure the published overhead figures
        run: |
          go test ./internal/proxy/ -run '^$' -bench 'BenchmarkNonStream|BenchmarkStream(Direct|Gateway)' -count 6 -timeout 30m | tee overhead.txt
          {
            echo '### Published overhead figures'
            echo '```'
            cat overhead.txt
            echo '```'
            echo '### Summarised'
            echo '```'
            benchstat overhead.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: measure reserve under contention
        run: |
          go test ./internal/store/ -run '^$' -bench 'BenchmarkReserve|BenchmarkSettle' -count 6 -timeout 30m | tee reserve.txt
          {
            echo '### Reserve under contention'
            echo '```'
            cat reserve.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      # The docker build only sees tracked files, so a source file excluded
      # by .gitignore compiles locally and fails here. Catch it directly.
      - name: every Go package is tracked by git
        run: |
          untracked=$(git ls-files --others --exclude-standard -- '*.go')
          if [ -n "$untracked" ]; then
            echo "Go sources not tracked by git (check .gitignore):"
            echo "$untracked"
            exit 1
          fi
      - name: docker build
        run: docker build -t costlane:ci .

  # The README's first promise is that the quickstart works with no
  # credential and costs nothing. That promise is worth exactly as much as
  # the last time someone ran it, so it runs here, as written.
  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker compose up
        run: docker compose up --build -d

      - name: wait for readiness
        run: |
          for _ in $(seq 60); do
            if curl -fsS localhost:8080/readyz >/dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "the gateway never became ready"
          docker compose logs
          exit 1

      - name: the liveness probe reports a version
        run: |
          curl -fsS localhost:8080/healthz | tee healthz.json
          grep -q '"version"' healthz.json

      # Exactly the commands in the README. If they change there, they have
      # to change here, which is the point.
      - name: mint a virtual key and spend against it
        run: |
          key=$(curl -fsS localhost:8080/admin/keys \
            -H "Authorization: Bearer dev-master-key-not-for-production-0123456789" \
            -H "Content-Type: application/json" \
            -d '{"label":"demo","limit_usd":"5"}' | jq -r .key)
          test -n "$key" && test "$key" != "null"

          curl -fsS -D headers.txt -o body.json localhost:8080/v1/chat/completions \
            -H "Authorization: Bearer $key" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-6-astra","messages":[{"role":"user","content":"hello"}]}'

          cat headers.txt
          grep -qi '^x-costlane-cost-usd:' headers.txt
          grep -qi '^x-costlane-budget-remaining-usd:' headers.txt

          # The usage record leaves the request path through a buffer, so it
          # arrives shortly after the response rather than with it.
          for _ in $(seq 15); do
            curl -fsS "localhost:8080/v1/usage?group_by=model,day" \
              -H "Authorization: Bearer $key" > usage.json
            if grep -q 'gpt-6-astra' usage.json; then
              cat usage.json; exit 0
            fi
            sleep 1
          done
          echo "the usage record never arrived:"; cat usage.json; exit 1

      # compose configures all three providers against the fake one, so this
      # goes through buildRouter - the seam a Gemini request actually crosses
      # in the binary, and the one that had no test until v0.2.1.
      - name: every configured provider is routable, and Gemini answers
        env:
          MASTER: dev-master-key-not-for-production-0123456789
        run: |
          set -eu
          key=$(curl -fsS localhost:8080/admin/keys -H "Authorization: Bearer $MASTER" -H "Content-Type: application/json" -d '{"label":"routing","limit_usd":"5"}' | jq -r .key)

          curl -fsS localhost:8080/v1/models -H "Authorization: Bearer $key" > models.json
          jq -r '.data[].owned_by' models.json | sort -u | tee owners.txt
          for p in openai anthropic google; do
            grep -qx "$p" owners.txt || { echo "/v1/models lists nothing owned by $p"; cat models.json; exit 1; }
          done

          # A real streamed request to a Gemini model, through the whole
          # binary. Until v0.2.1 this answered 404, because the router had no
          # google provider to hand it to.
          curl -fsS localhost:8080/v1/chat/completions -H "Authorization: Bearer $key" -H "Content-Type: application/json" -d '{"model":"gemini-3.8-flash","messages":[{"role":"user","content":"hi"}],"stream":true}' -o stream.txt
          grep -q 'chat.completion.chunk' stream.txt || { echo "no chunks came back from Gemini"; cat stream.txt; exit 1; }

          # A streamed response carries no cost header - the cost is not known
          # until the stream ends, and the headers left before it began. The
          # proof that it was metered is the usage record.
          for _ in $(seq 15); do
            curl -fsS "localhost:8080/v1/usage?group_by=model" -H "Authorization: Bearer $key" > usage.json
            if grep -q 'gemini-3.8-flash' usage.json; then
              cat usage.json
              exit 0
            fi
            sleep 1
          done
          echo "the Gemini stream produced no usage record"; cat usage.json; exit 1

      - name: show the logs when something failed
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v
