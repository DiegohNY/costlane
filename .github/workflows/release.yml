name: release

# Tag-driven, and nothing else: the image that carries a version number is
# built from the commit that tag points at, by this job, and by nobody's
# laptop.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arm64 is built under emulation. A cross-compiled Go binary would be
      # faster, but this keeps one Dockerfile rather than two paths that can
      # disagree.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR rejects an image name with a capital letter in it, and this
      # repository's owner has two. github.repository is passed through tr
      # rather than typed out by hand so a rename cannot silently break the
      # release job.
      - name: derive the image name
        run: |
          owner_repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner_repo" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The version is stamped into the binary, so /healthz reports the
          # same string as the tag that produced it.
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
