version: "2"

linters:
  enable:
    - errcheck      # an unchecked error is a silent failure
    - bodyclose     # a leaked response body is a leaked connection
    - gosec         # this process handles provider credentials
    - staticcheck
    - govet
    - ineffassign
    - unused
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Test fixtures carry deliberately fake credentials and predictable
      # values; gosec flags both, and neither matters in a test.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
